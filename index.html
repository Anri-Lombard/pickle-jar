<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <title>Pickle Jar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&family=Montserrat:wght@400;500;600;700&display=block" rel="stylesheet" />
    <style>
      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #ede9d9;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      canvas { display: block; touch-action: none; }
      touch-controls { display: none !important; }
    </style>
    <script type="module" crossorigin src="./assets/index-BHNDHpUy.js"></script>
  </head>
  <body>
    <script>
      /* On the Nest Hub the page runs as a Google Cast Web Receiver (the Cast
       * runtime puts "CrKey" in the user agent). On touch displays the hub ends
       * a session that has played no media for about ten minutes, so a still of
       * the jar is loaded every nine minutes, as Home Assistant Cast does. */
      if (/CrKey/.test(navigator.userAgent)) {
        const sdk = document.createElement("script");
        sdk.src = "https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js";
        sdk.onload = () => {
          const fw = cast.framework;
          const ctx = fw.CastReceiverContext.getInstance();
          const player = document.createElement("cast-media-player");
          player.style.display = "none";
          document.body.append(player);
          const options = new fw.CastReceiverOptions();
          options.disableIdleTimeout = true;
          options.uiConfig = new fw.ui.UiConfig();
          options.uiConfig.touchScreenOptimizedApp = true;
          ctx.start(options);
          const keepAlive = () => {
            const req = new fw.messages.LoadRequestData();
            req.autoplay = true;
            req.media = new fw.messages.MediaInformation();
            req.media.contentId = new URL("jar.png", location.href).href;
            req.media.contentType = "image/png";
            req.media.streamType = "NONE";
            req.media.metadata = new fw.messages.GenericMediaMetadata();
            req.media.metadata.title = "Pickle Jar";
            ctx.getPlayerManager().load(req);
          };
          ctx.addEventListener(fw.system.EventType.READY, () => {
            keepAlive();
            if (ctx.getDeviceCapabilities()?.touch_input_supported) setInterval(keepAlive, 9 * 60 * 1000);
          });
        };
        document.head.append(sdk);
      }
    </script>
  </body>
</html>
