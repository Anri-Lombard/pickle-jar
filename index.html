<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Pickle Jar</title>
<style>
  :root {
    --bg: #ede9d9;
    --ink: #0b0b09;
    --muted: rgba(11, 11, 9, 0.55);
    --floor: rgba(11, 11, 9, 0.08);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1a1913;
      --ink: #ede9d9;
      --muted: rgba(237, 233, 217, 0.6);
      --floor: rgba(237, 233, 217, 0.08);
    }
  }
  :root[data-theme="dark"] {
    --bg: #1a1913;
    --ink: #ede9d9;
    --muted: rgba(237, 233, 217, 0.6);
    --floor: rgba(237, 233, 217, 0.08);
  }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--ink);
    font-family: ui-rounded, "SF Pro Rounded", "Nunito", system-ui, sans-serif;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #back, #fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #back { z-index: 1; }
  #fx { z-index: 3; }
  #stage {
    position: fixed;
    inset: 0;
    z-index: 2;
    display: grid;
    place-items: center;
    padding-top: 4vh;
    cursor: pointer;
  }
  #jar {
    height: min(70vh, 120vw);
    aspect-ratio: 462 / 545;
    transform-origin: 50% 100%;
    position: relative;
    will-change: transform;
  }
  #wig, #breath { position: absolute; inset: 0; transform-origin: 50% 100%; will-change: transform; }
  #breath { animation: breathe 3.6s ease-in-out infinite; }
  /* Each moving part is its own layer so the display can move it without
     repainting the rest of the jar. */
  .layer { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; display: block; will-change: transform; }
  @keyframes breathe {
    50% { transform: scale(1.012, 0.988); }
  }
  .part { transform-box: fill-box; transform-origin: center; }
  .pupil { transition: transform 220ms cubic-bezier(.2, .8, .3, 1); }
  #floor {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    height: 5vh;
    background: var(--floor);
    z-index: 0;
  }
  #count {
    position: fixed;
    top: 3.5vh;
    left: 4vw;
    z-index: 4;
    line-height: 1;
  }
  #count b {
    display: block;
    font-size: 9vh;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
  }
  #count span { font-size: 2.8vh; color: var(--muted); font-weight: 600; }
  #count i { font-style: normal; font-variant-numeric: tabular-nums; }
  #hint {
    position: fixed;
    right: 4vw;
    top: 4.5vh;
    z-index: 4;
    font-size: 3.4vh;
    font-weight: 700;
    color: var(--muted);
    transition: opacity 600ms ease;
  }
  #hint.hide { opacity: 0; }
  #shout {
    position: fixed;
    left: 0; right: 0;
    top: 2vh;
    z-index: 4;
    text-align: center;
    font-size: 8vh;
    font-weight: 800;
    text-shadow: 0 0 0.12em var(--bg), 0 0 0.12em var(--bg), 0 0 0.25em var(--bg);
    opacity: 0;
    pointer-events: none;
  }
  touch-controls { display: none !important; }
</style>
</head>
<body>
<div id="floor"></div>
<canvas id="back" aria-hidden="true"></canvas>
<div id="stage" role="button" aria-label="Tap the Solenya jar to pop a pickle">
  <div id="jar"></div>
</div>
<canvas id="fx" aria-hidden="true"></canvas>
<div id="count"><b id="n">0</b><span>pickles popped · <i id="today">0</i> today</span></div>
<div id="hint">Tap the jar</div>
<div id="shout" aria-live="polite"></div>

/* Layers move in screen pixels; the artwork is drawn in viewBox units. */
const unit = () => jarBox.clientHeight / H;
/* A new move on a part starts from wherever its last move had got to,
 * so quick taps don't snap the lid or jar back to rest first. */
const moving = new WeakMap();
function play(el, frames, opts) {
  const prev = moving.get(el);
  if (prev && prev.playState === "running") {
    frames[0] = { ...frames[0], transform: getComputedStyle(el).transform };
    prev.cancel();
  }
  const a = el.animate(frames, opts);
  moving.set(el, a);
  return a;
}

/* ---------- The mouth: charm's mouthPath, ported from jar-motion.ts ---------- */

const SMILE = (() => {
  const n = P.MOUTH_AT_REST.match(/-?\d*\.?\d+/g).map(Number);
  const start = [n[0], n[1]];
  const curves = [];
  let [x, y] = start;
  for (let i = 2; i + 5 < n.length; i += 6) {
    const c = [[x + n[i], y + n[i + 1]], [x + n[i + 2], y + n[i + 3]], [x + n[i + 4], y + n[i + 5]]];
    curves.push(c);
    [x, y] = c[2];
  }
  return { start, curves };
})();
const LOWER = 5, MID = 225, O = { x: 225, y: 364, rx: 21, ry: 25 };
const bell = (x) => { const w = Math.min(1, Math.abs(x - MID) / 46); return 1 - w * w; };
const ROUND = (() => {
  const xs = [SMILE.start[0], ...SMILE.curves.map((c) => c[2][0])];
  const left = Math.min(...xs), right = Math.max(...xs);
  const along = (x) => clamp((x - left) / (right - left), 0, 1);
  const ends = SMILE.curves.map((c, i) => (i < LOWER ? Math.PI : -Math.PI) * (1 - along(c[2][0])));
  ends[ends.length - 1] = -Math.PI;
  const pt = (a) => [O.x + Math.cos(a) * O.rx, O.y + Math.sin(a) * O.ry];
  let from = Math.PI;
  return ends.map((to) => {
    const k = (4 / 3) * Math.tan((to - from) / 4);
    const [x0, y0] = pt(from), [x1, y1] = pt(to);
    const c1 = [x0 - k * Math.sin(from) * O.rx, y0 + k * Math.cos(from) * O.ry];
    const c2 = [x1 + k * Math.sin(to) * O.rx, y1 - k * Math.cos(to) * O.ry];
    from = to;
    return [c1, c2, [x1, y1]];
  });
})();
function mouthPath(open, round = 0) {
  if (open <= 0 && round <= 0) return P.MOUTH_AT_REST;
  const stretch = ([x, y], lower) => {
    const b = bell(x);
    return [MID + (x - MID) * (1 - 0.16 * open), lower ? y + open * 36 * b : y - open * 11 * b];
  };
  const size = 0.5 + 0.5 * open;
  const toward = (p, q) => {
    const qx = O.x + (q[0] - O.x) * size, qy = O.y + (q[1] - O.y) * size;
    return `${(p[0] + (qx - p[0]) * round).toFixed(2)},${(p[1] + (qy - p[1]) * round).toFixed(2)}`;
  };
  const start = toward(stretch(SMILE.start, false), [O.x - O.rx, O.y]);
  const curves = SMILE.curves.map((c, i) =>
    `C ${c.map((p, j) => toward(stretch(p, i < LOWER), (ROUND[i] || c)[j] || p)).join(" ")}`).join(" ");
  return `M ${start} ${curves} Z`;
}

/* The face's soft state eases toward its targets every frame. */
const face = { open: 0, round: 0, blush: 0 };
const want = { open: 0, round: 0, blush: 0 };
let lastDrawn = "";
function tick() {
  for (const k in face) face[k] += (want[k] - face[k]) * 0.18;
  const key = `${face.open.toFixed(3)}|${face.round.toFixed(3)}|${face.blush.toFixed(3)}`;
  if (key !== lastDrawn) {
    lastDrawn = key;
    const d = mouthPath(face.open, face.round);
    mouth.setAttribute("d", d);
    mouthClip.setAttribute("d", d);
    tongue.setAttribute("opacity", clamp((face.open - 0.25) * 2, 0, 1).toFixed(2));
    blush.style.opacity = face.blush.toFixed(2);
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

/* ---------- Eyes ---------- */

let gazeUntil = 0;
function look(dx, dy) {
  pupils.forEach((p) => { p.style.transform = `translate(${dx}px, ${dy}px)`; });
}
function lookAtScreen(x, y) {
  const r = jarBox.getBoundingClientRect();
  const sx = ((x - r.left) / r.width) * W, sy = ((y - r.top) / r.height) * H;
  const [ex, ey] = [(EYE.left[0] + EYE.right[0]) / 2, (EYE.left[1] + EYE.right[1]) / 2];
  const a = Math.atan2(sy - ey, sx - ex);
  const reach = clamp(Math.hypot(sx - ex, sy - ey) / 60, 0, 1);
  look(Math.cos(a) * 13 * reach, Math.sin(a) * 9 * reach);
  gazeUntil = performance.now() + 1600;
}
function blink() {
  eyes.forEach((e) => e.animate(
    [{ transform: "scaleY(1)" }, { transform: "scaleY(0.08)", offset: 0.45 }, { transform: "scaleY(1)" }],
    { duration: 170, easing: "ease-in-out" }));
}
(function blinkLoop() {
  setTimeout(() => {
    blink();
    if (Math.random() < 0.2) setTimeout(blink, 240);
    blinkLoop();
  }, rand(2200, 5800));
})();
(function wanderLoop() {
  setTimeout(() => {
    if (performance.now() > gazeUntil) {
      Math.random() < 0.45 ? look(0, 0) : look(rand(-11, 11), rand(-6, 7));
    }
    wanderLoop();
  }, rand(1400, 3600));
})();

async function prepareArt() {
  const dpr = devicePixelRatio || 1;

    ctx.canvas.height = Math.round(innerHeight * dpr);

    const img = new Image();
    img.src = URL.createObjectURL(new Blob([svgText], { type: "image/svg+xml" }));

    const art = sprite(size, size * 2);

  const c = Math.cos(s.rot), n = Math.sin(s.rot);
  ctx.globalAlpha = Math.min(1, s.a);
  ctx.setTransform(c * s.sx * ctx.dpr, n * s.sx * ctx.dpr, -n * s.sy * ctx.dpr, c * s.sy * ctx.dpr, s.x * ctx.dpr, s.y * ctx.dpr);
  ctx.drawImage(art, -w / 2, -h / 2, w, h);
}
/* Each item reports where it is now; null means it has finished. Items that
 * are only resting don't keep the frame loop running. */
function paint(ctx, items, now) {
  ctx.dpr = devicePixelRatio || 1;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height);
  let busy = false;
  for (let i = items.length - 1; i >= 0; i--) {
    const it = items[i];
    const st = it.at(now);
    if (!st) { items.splice(i, 1); busy = true; continue; }
    if (!st.still) busy = true;
  }
  for (const it of items) {
    const st = it.last;
    if (!st) continue;
    if (it.drop) stamp(ctx, dropArt, it.size, it.size, st);
    else stamp(ctx, it.gold ? goldArt : pickleArt, it.size, it.size * 2, st);
  }
  ctx.globalAlpha = 1;
  return busy;
}
let raf = 0;
function wake() { if (!raf) raf = requestAnimationFrame(frame); }
function frame(now) {
  raf = 0;
  const a = paint(backCtx, backItems, now);
  const b = paint(fxCtx, fxItems, now);
  if (a || b) wake();
}
function add(list, it) {
  const at = it.at;
  it.at = (now) => (it.last = at(now));
  list.push(it);
  wake();
}

function mouthOfJar() {
  const r = jarBox.getBoundingClientRect();
  return { x: r.left + r.width / 2, y: r.top + r.height * 0.16, r };
}

/* Drops fly on a parabola and stretch along their heading, like liquid. */
function brine(count) {
  const { x, y, r } = mouthOfJar();
  const g = r.height * 1.5;
  let drops = backItems.filter((it) => it.drop).length;
  for (let i = 0; i < count && drops < DROP_CAP; i++, drops++) {
    const a = (rand(-150, -30) * Math.PI) / 180;
    const v = rand(0.5, 1.05) * r.height;
    const vx = Math.cos(a) * v, vy = Math.sin(a) * v, top = v;
    const x0 = x + rand(-r.width * 0.2, r.width * 0.2);
    const start = performance.now() + rand(0, 70), dur = rand(650, 950);
    add(backItems, {
      drop: true, size: rand(5, 12),
      at(now) {
        const t = (now - start) / dur;
        if (t > 1) return null;
        if (t < 0) return { x: x0, y, rot: 0, sx: 1, sy: 1, a: 0 };
        const sy = vy + 2 * g * t;
        const stretch = 1 + Math.min(1.6, Math.hypot(vx, sy) / top);
        return {
          x: x0 + vx * t, y: y + vy * t + g * t * t,
          rot: Math.atan2(sy, vx) - Math.PI / 2,
          sx: 1 / Math.sqrt(stretch), sy: stretch,
          a: t < 0.06 ? t / 0.06 : t > 0.7 ? (1 - t) / 0.3 : 1,
        };
      },
    });
  }
}

/* Popped pickles land on the floor and heap up in columns. */
const COLS = 14;
const MAX_ROWS = 4;
const heap = Array.from({ length: COLS }, () => []);
const pile = [];
const easeIn = (t) => t * t * t;
function popPickle(gold = false) {
  const { x, y, r } = mouthOfJar();
  const size = pickleSize();
  // Land beside the jar, never behind it, and fill the floor before stacking
  // so the pile frames the face instead of growing towers up to it.
  const cols = [];
  for (let c = 0; c < COLS; c++) {
    const cx = ((c + 0.5) / COLS) * innerWidth;
    if (cx > size * 0.8 && cx < innerWidth - size * 0.8 && (cx < r.left - size * 0.6 || cx > r.right + size * 0.6)) cols.push(c);
  }
  while (pile.length >= cols.length * MAX_ROWS - 1) tidy();
  const col = [pick(cols), pick(cols), pick(cols)].reduce((a, b) => (heap[b].length < heap[a].length ? b : a));
  const tx = ((col + rand(0.25, 0.75)) / COLS) * innerWidth;
  const floor = innerHeight - innerHeight * 0.05 + size * 0.15;
  const base = floor - size * 0.5, step = size * 0.62;
  const ty = base - heap[col].length * step;
  const rot = (Math.random() < 0.5 ? 90 : -90) + rand(-25, 25);
  const spin = ((rot + 360 * (Math.random() < 0.5 ? 1 : -1)) * Math.PI) / 180;
  const apex = rand(0.25, 0.42) * innerHeight;
  const start = performance.now(), dur = rand(1000, 1250);
  const e = {
    gold, col, base, step, size, ty, landTy: ty, landsAt: start + dur, settle: null, fadeFrom: 0,
    at(now) {
      let a = 1;
      if (e.fadeFrom) {
        a = 1 - (now - e.fadeFrom) / 500;
        if (a <= 0) return null;
      }
      const u = (now - start) / dur;
      if (u < 0.82) {
        const t = u / 0.82;
        return {
          x: x + (tx - x) * t, y: y + (e.landTy - y) * t - apex * 4 * t * (1 - t),
          rot: spin * t, sx: 0.55 + 0.45 * Math.min(1, t * 4), sy: 0.55 + 0.45 * Math.min(1, t * 4),
          a: t < 0.05 ? 0 : a,
        };
      }
      let yy = e.landTy, still = u >= 1 && !e.fadeFrom;
      if (e.settle) {
        const k = clamp((now - e.settle.start) / 380, 0, 1);
        yy = e.settle.from + (e.settle.to - e.settle.from) * easeIn(k);
        if (k < 1) still = false;
        else { e.landTy = e.settle.to; e.settle = null; }
      }
      const squish = u < 0.9 ? (u - 0.82) / 0.08 : u < 1 ? 1 - (u - 0.9) / 0.1 : 0;
      return { x: tx, y: yy, rot: spin, sx: 1 + 0.12 * squish, sy: 1 - 0.14 * squish, a, still };
    },
  };
  add(backItems, e);
  heap[col].push(e);
  pile.push(e);
}
function tidy() {
  const old = pile.shift();
  if (!old) return;
  const stack = heap[old.col];
  stack.splice(stack.indexOf(old), 1);
  old.fadeFrom = performance.now();
  // Pickles above the one removed settle down a row instead of floating.
  stack.forEach((e, row) => {
    const to = e.base - row * e.step;
    if (to === e.ty) return;
    const from = e.settle ? e.settle.to : e.landTy;
    e.ty = to;
    e.settle = { from, to, start: Math.max(performance.now(), e.landsAt) + 250 };
  });
  wake();
}

function rain(count, gold = false) {
  if (reduced) return;
  const size = pickleSize();
  let n = fxItems.length;
  for (let i = 0; i < count && n < DROP_CAP; i++, n++) {
    const x0 = rand(0, innerWidth), r0 = (rand(-180, 180) * Math.PI) / 180, dr = (rand(-540, 540) * Math.PI) / 180;
    const start = performance.now() + rand(0, 900), dur = rand(1300, 2200);
    const fall = innerHeight + size * 4;
    add(fxItems, {
      size, gold,
      at(now) {
        const t = (now - start) / dur;
        if (t > 1) return null;
        const k = Math.max(0, t) ** 2;
        return { x: x0, y: -size * 2 + fall * k, rot: r0 + dr * k, sx: 1, sy: 1, a: t < 0 ? 0 : 1 };
      },
    });
  }
}

const shoutEl = document.getElementById("shout");
function shout(text) {
  shoutEl.textContent = text;
  shoutEl.animate([
    { opacity: 0, transform: "scale(.6)" },
    { opacity: 1, transform: "scale(1.08)", offset: 0.15 },
    { opacity: 1, transform: "scale(1)", offset: 0.25 },
    { opacity: 1, transform: "scale(1)", offset: 0.8 },
    { opacity: 0, transform: "scale(.95)" },
  ], { duration: 1800, easing: "ease-out", fill: "forwards" });
}

/* ---------- Jar moves ---------- */

function squash(power = 1) {
  const a = 0.08 * power;
  play(jarBox, [
    { transform: "scale(1, 1)" },
    { transform: `scale(${1 + a * 0.7}, ${1 - a})`, offset: 0.18 },
    { transform: `scale(${1 - a * 0.4}, ${1 + a * 0.6})`, offset: 0.45 },
    { transform: `scale(${1 + a * 0.15}, ${1 - a * 0.15})`, offset: 0.7 },
    { transform: "scale(1, 1)" },
  ], { duration: 520, easing: "ease-out" });
}
function lidPop(height = 70, hold = 0) {
  const tilt = rand(-14, 14);
  height *= unit();
  play(lid, [
    { transform: "translateY(0) rotate(0)" },
    { transform: `translateY(${-height}px) rotate(${tilt}deg)`, offset: 0.35 },
    { transform: `translateY(${-height}px) rotate(${tilt}deg)`, offset: 0.35 + hold },
    { transform: `translateY(${4 * unit()}px) rotate(0)`, offset: 0.85 },
    { transform: "translateY(0) rotate(0)" },
  ], { duration: 560 + hold * 1400, easing: "ease-in-out" });
}
function browsUp(px = 12, ms = 420) {
  px *= unit();
  brows.forEach((b) => play(b, [
    { transform: "translateY(0)" }, { transform: `translateY(${-px}px)`, offset: 0.3 }, { transform: "translateY(0)" },
  ], { duration: ms, easing: "ease-out" }));
}
function wiggle() {
  play(wig, [0, -4, 4, -3, 3, -1, 0].map((d) => ({ transform: `rotate(${d}deg)` })),
    { duration: 900, easing: "ease-in-out" });
}

/* ---------- Taps ---------- */

const nEl = document.getElementById("n");
const hint = document.getElementById("hint");
const todayEl = document.getElementById("today");
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, String(v)); } catch {} },
};
const dayKey = () => new Date().toDateString();
if (new URLSearchParams(location.search).has("reset")) {
  store.set("pickle-jar-count", 0);
  store.set("pickle-jar-today", 0);
}
let count = Number(store.get("pickle-jar-count")) || 0;
let today = store.get("pickle-jar-day") === dayKey() ? Number(store.get("pickle-jar-today")) || 0 : 0;
nEl.textContent = count.toLocaleString("en-ZA");
todayEl.textContent = today;
let combo = 0, lastTap = 0, lastActive = performance.now(), calmTimer;

function pop(x, y) {
  const now = performance.now();
  combo = now - lastTap < 650 ? combo + 1 : 1;
  lastTap = lastActive = now;
  hint.classList.add("hide");
  lookAtScreen(x, y);
  squash(Math.min(1.6, 0.8 + combo * 0.08));
  lidPop(50 + Math.min(60, combo * 6));
  browsUp(8 + Math.min(10, combo));
  brine(4 + Math.min(5, combo));
  const gold = Math.random() < 1 / 40;
  popPickle(gold);
  if (combo >= 3 && Math.random() < 0.5) popPickle();
  want.open = clamp((combo - 1) / 7, 0, 1);
  want.round = combo >= 9 ? 0.8 : 0;
  want.blush = clamp(combo / 8, 0, 1);
  count++;
  if (store.get("pickle-jar-day") !== dayKey()) { today = 0; store.set("pickle-jar-day", dayKey()); }
  today++;
  nEl.textContent = count.toLocaleString("en-ZA");
  todayEl.textContent = today;
  nEl.animate([{ transform: "scale(1.15)" }, { transform: "scale(1)" }], { duration: 220, easing: "ease-out" });
  store.set("pickle-jar-count", count);
  store.set("pickle-jar-today", today);
  if (gold) { shout("Golden pickle!"); rain(10, true); }
  else if (combo === 6) shout("Crunchy!");
  else if (combo === 12) { shout("Pickle party!"); rain(26); wiggle(); }
  else if (count % 100 === 0) { shout(`${count.toLocaleString("en-ZA")} pickles!`); rain(18); }
  clearTimeout(calmTimer);
  calmTimer = setTimeout(() => { want.open = 0; want.round = 0; want.blush = 0; }, 900);
}

document.addEventListener("pointerdown", (e) => { e.preventDefault(); pop(e.clientX, e.clientY); }, { passive: false });
document.addEventListener("contextmenu", (e) => e.preventDefault());
document.addEventListener("keydown", (e) => {
  if (e.key === " " || e.key === "Enter") pop(innerWidth / 2, innerHeight / 2);
});

/* ---------- On its own: tricks while nobody is tapping ---------- */

const tricks = {
  peek() {
    lidPop(42, 0.5);
    setTimeout(() => {
      const { x, y, r } = mouthOfJar();
      const size = pickleSize();
      const side = Math.random() < 0.5 ? -1 : 1;
      const start = performance.now();
      add(backItems, {
        size,
        at(now) {
          const t = (now - start) / 1100;
          if (t > 1) return null;
          return {
            x: x + side * r.width * 0.25 * Math.sin(Math.PI * t), y: y - r.height * 0.6 * 4 * t * (1 - t),
            rot: side * 2 * Math.PI * t, sx: 1, sy: 1,
            a: t < 0.08 ? t / 0.08 : t > 0.88 ? (1 - t) / 0.12 : 1,
          };
        },
      });
    }, 120);
  },
  lookAround() {
    look(-13, 1); gazeUntil = performance.now() + 2600;
    setTimeout(() => look(13, 1), 900);
    setTimeout(() => { look(0, 0); browsUp(10, 500); }, 1800);
  },
  hiccup() {
    want.open = 0.35; want.round = 0.9;
    setTimeout(() => { squash(0.7); lidPop(30); brine(6); want.open = 0; want.round = 0; }, 380);
  },
  happy() {
    want.open = 0.4; want.blush = 0.6; wiggle();
    setTimeout(() => { want.open = 0; want.blush = 0; }, 1300);
  },
};
/* Office moments: once a day at a set time, weekdays only. */
const moments = [
  { at: "09:00", days: [1, 2, 3, 4, 5], run() { shout("Standup time!"); wiggle(); lidPop(80); rain(20); } },
  { at: "13:00", days: [1, 2, 3, 4, 5], run() { shout("Lunch!"); tricks.happy(); rain(12); } },
  { at: "16:00", days: [5], run() { shout("Pickle Friday!"); wiggle(); rain(30, true); } },
];
function checkMoments() {
  const d = new Date();
  const hm = `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
  for (const m of moments) {
    const key = `pickle-jar-moment-${m.at}`;
    if (m.at === hm && m.days.includes(d.getDay()) && store.get(key) !== dayKey()) {
      store.set(key, dayKey());
      m.run();
    }
  }
}

let nextTrick = performance.now() + 9000;
setInterval(() => {
  checkMoments();
  const now = performance.now();
  const idle = now - lastActive;
  if (idle > 8000) hint.classList.remove("hide");
  if (idle > 60000 && pile.length && Math.random() < 0.3) tidy();
  if (idle > 6000 && now > nextTrick) {
    pick(Object.values(tricks))();
    nextTrick = now + rand(9000, 18000);
  }
}, 1000);

/* ---------- On the Nest Hub: run as a Google Cast Web Receiver ---------- */

/* The Cast runtime sets "CrKey" in the user agent; everywhere else the page is
 * a plain web page. On touch displays the hub ends a session that has played
 * no media for about ten minutes, so a placeholder image is loaded every nine
 * minutes (the same approach as Home Assistant Cast's receiver). */
if (/CrKey/.test(navigator.userAgent)) {
  const sdk = document.createElement("script");
  sdk.src = "https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js";
  sdk.onload = startReceiver;
  document.head.append(sdk);
}
function startReceiver() {
  const fw = cast.framework;
  const ctx = fw.CastReceiverContext.getInstance();
  const player = document.createElement("cast-media-player");
  player.style.display = "none";
  document.body.append(player);
  const options = new fw.CastReceiverOptions();
  options.disableIdleTimeout = true;
  options.uiConfig = new fw.ui.UiConfig();
  options.uiConfig.touchScreenOptimizedApp = true;
  ctx.start(options);
  const keepAlive = () => {
    const req = new fw.messages.LoadRequestData();
    req.autoplay = true;
    req.media = new fw.messages.MediaInformation();
    req.media.contentId = new URL("jar.png", location.href).href;
    req.media.contentType = "image/png";
    req.media.streamType = "NONE";
    req.media.metadata = new fw.messages.GenericMediaMetadata();
    req.media.metadata.title = "Pickle Jar";
    ctx.getPlayerManager().load(req);
  };
  ctx.addEventListener(fw.system.EventType.READY, () => {
    keepAlive();
    if (ctx.getDeviceCapabilities()?.touch_input_supported) setInterval(keepAlive, 9 * 60 * 1000);
  });
}
</script>
